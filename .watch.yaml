# Funzzy watcher configuration.
# Start with: fzz watch
# Validate with: fzz check

on:
  socket: .pi/funzzy.sock
  debounce: 500ms
  respect_gitignore: true
  ignore:
    - .tmp/**
    - .pi/**
    - node_modules/**
    - coverage/**
    - "**/*.log"

execution:
  concurrency: 2
  output: show-on-failure

jobs:
  - name: test @quick
    run: npm test
    change:
      - src/**/*.ts
      - package.json
      - package-lock.json
      - tsconfig.json
    run_on_init: true

  - name: lint @quick
    run: npm run lint
    change:
      - src/**/*.ts
      - package.json
      - package-lock.json
      - tsconfig.json
    run_on_init: true

  - name: security audit @quick
    run: npm audit --omit=dev --audit-level=moderate
    change:
      - package.json
      - package-lock.json
    run_on_init: true

  - name: quality gate @agent-final
    run: make all
    change:
      - src/**/*.ts
      - package.json
      - package-lock.json
      - tsconfig.json
      - Makefile
      - .watch.yaml
      - README.md
      - docs/**
    run_on_init: true
