# Funzzy watcher configuration.
# Start with: fzz watch
# Validate with: fzz check

on:
    socket: .pi/funzzy.sock
    debounce: 2s
    respect_gitignore: true
    ignore:
        - .git/**
        - .tmp/**
        - .pi/**
        - node_modules/**
        - coverage/**
        - .bebop-build.lock
        - .bebop-build.lock/**
        - .bebop-build-*
        - .bebop-build-*/**
        - "**/*.log"

# Full test/build gates are serialized per worktree; lint remains independently safe.
execution:
    concurrency: 1
    output: show-on-failure

hooks:
    failure: scripts/notify-crew-on-watch-failure.sh

jobs:
    - name: test @quick
      run: npm test
      parallel: quick
      change:
          - src/**/*.ts
          - package.json
          - package-lock.json
          - tsconfig.json
      run_on_init: true

    - name: lint @quick
      run: npm run lint
      parallel: quick
      change:
          - src/**/*.ts
          - package.json
          - package-lock.json
          - tsconfig.json
      run_on_init: true

    - name: quality gate @agent-final
      run: make all
      change: "**/*"
      run_on_init: true
