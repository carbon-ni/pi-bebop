name: Release

on:
    release:
        types: [published]

# One release may publish only one canonical artifact at a time.
concurrency:
    group: release-${{ github.event.release.tag_name }}
    cancel-in-progress: false

jobs:
    quality-gate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.release.tag_name }}
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: make all

    publish:
        needs: quality-gate
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.release.tag_name }}
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org
                  cache: npm
            - run: npm ci
            - name: Verify release identity
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: |
                  test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
                  test "${{ github.event.release.name }}" != ""
            - name: Build the canonical artifact once
              run: |
                  mkdir -p .release
                  npm pack --pack-destination .release
                  tarball="$(find .release -name '*.tgz' -print -quit)"
                  test -n "$tarball"
                  sha256sum "$tarball" > .release/SHA256SUMS
                  echo "TARBALL=$tarball" >> "$GITHUB_ENV"
            - name: Publish exact artifact to npm with trusted publishing
              env:
                  PACKAGE: "@carbon-ni/pi-bebop"
              run: |
                  version="$(node -p "require('./package.json').version")"
                  if npm view "$PACKAGE@$version" version --json >/dev/null 2>&1; then
                    echo "npm $PACKAGE@$version already exists; refusing to overwrite or rebuild it."
                    exit 1
                  fi
                  npm publish "$TARBALL" --access public --tag "${{ github.event.release.prerelease && 'next' || 'latest' }}"
            - name: Attach artifact and checksum to the GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: |
                  gh release upload "$RELEASE_TAG" "$TARBALL" .release/SHA256SUMS
                  echo "Published $TARBALL ($(cut -d' ' -f1 .release/SHA256SUMS))." >> "$GITHUB_STEP_SUMMARY"
