name: CI

on:
    pull_request:
    push:
        branches:
            - main

jobs:
    quality-gate:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - name: Run bounded quality gate
              run: |
                  set -o pipefail
                  if timeout --foreground --signal=TERM --kill-after=30s 4m make all; then
                    exit 0
                  else
                    status=$?
                    if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
                      echo "::error::quality gate exceeded its 4 minute bound (status $status)"
                    else
                      echo "::error::quality gate failed (status $status)"
                    fi
                    ps -eo pid,ppid,stat,etime,cmd --forest
                    exit "$status"
                  fi
